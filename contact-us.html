<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐟FishFinds Contact Us</title>
</head>
<body>
     <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact us.html">Contact Us</a>
        </nav>
    </header>
    <br>
    <form>
        <label for="fname">Name:</label>
        <input type="text" id="fname" name="fname" placeholder="e.g John Doe." required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="e.g johndoe@gmail.com" required><br><br>
        <label for="phone">Phone Number:</label>
        <input type="number" id="phone" name="phone"><br><br>
        <label for="help">How can we help you today?</label>
        <select id="help" name="help">
            <option value="cooking">Fish for cooking</option>
            <option value="recreation">Fish for Recreation</option>
            <option value="aquarium">Aquarium Fish</option>
            <option value="other">Others</option> 
        </select>
        <br><br>
        <div>
            <p>What are you purchasing a list of fish for?:</p>
        <input type="radio" id="cooking" name="purpose">
        <label for="cooking">Cooking</label><br><br>
        <input type="radio" id="recreate" name="purpose">
        <label for="recreate">Recreation</label><br><br>
        <input type="radio" id="aquarium" name="purpose">
        <label for="aquarium">Aquarium</label><br><br>
        </div>
        <br>
        <div>
            <input type="checkbox" id="agree" name="agree">
        <label for="agree">I AGREE TO THE TERMS AND CONDITIONS AND CONSENT TO THE USE OF MY INFORMATION TO IMPROVE MY EXPERIENCE</label> 
        <div> 
            <br>
        </div>
            <label for="message">Tell us more about your request!</label><br><br>
        <textarea id="message" name="message" rows="5" cols="45" placeholder="Write something about your request!"></textarea>
        </div>
        <button onclick="Submit">Submit Request!</button>
        


    </form>
    <aside>
        <ul classname="links">
            <li><a href="">Instagram</a></li>
            <li><a href="">WhatsApp</a></li>
            <li><a href="">Facebook</a></li>
        </ul>
    </aside>
</body>
</html>
